name: Deploy to Hostinger

on:
  push:
    branches:
      - main
    # Docs and tracker edits don't change the site, so they don't deploy
    paths-ignore:
      - "vibes/**"
      - "**/*.md"
      - ".claude/**"
  workflow_dispatch:
    inputs:
      fresh:
        description: "Re-upload all files without wiping the live site (normally leave off)"
        type: boolean
        default: false

# One deploy at a time; a newer push waits instead of racing the FTP sync
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Incremental Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FRESH: ${{ github.event.inputs.fresh == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Fails in ~1s on broken links, bad fences or a stale glossary, before anything uploads
      - name: Check content
        run: npm run check:content

      # Include content so successful builds refresh the cache after content edits.
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/app/**', 'src/components/**', 'src/lib/**', 'src/types/**', 'src/content/**/*.mdx', 'src/content/**/*.yml', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Test deployment scripts
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Validate smoke-test targets
        run: python3 scripts/smoke-test.py --local

      - name: Deploy changed files (4 parallel connections)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: /domains/sunmintz.com/public_html/learngenai/
        run: python3 scripts/deploy.py

      - name: Smoke test
        run: python3 scripts/smoke-test.py

image:
  repository: vllm-serving
  tag: "0.1.0"   # pin an immutable tag (or digest) - never deploy :latest
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: "2"
    memory: "8Gi"
    nvidia.com/gpu: "1"
  limits:
    cpu: "4"
    memory: "16Gi"
    # Must equal the request - GPUs are not overcommittable, see
    # Notes/02-Kubernetes-and-Helm.mdx
    nvidia.com/gpu: "1"

nodeSelector:
  cloud.google.com/gke-accelerator: nvidia-l4

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Equal"
    value: "present"
    effect: "NoSchedule"

service:
  type: ClusterIP
  port: 8000

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  # Scale on queue depth, not GPU utilization - a busy vLLM server shows high GPU
  # utilization whether or not requests are queueing. Requires a custom-metrics
  # pipeline (Prometheus scraping vLLM's /metrics + Prometheus Adapter, or KEDA);
  # the default HPA only sees CPU/memory. See Notes/05-LLM-Serving-on-Kubernetes.mdx
  queueDepthMetric: vllm_num_requests_waiting
  targetWaitingRequestsPerPod: 5

rollout:
  strategy: RollingUpdate
  maxSurge: 1
  maxUnavailable: 0

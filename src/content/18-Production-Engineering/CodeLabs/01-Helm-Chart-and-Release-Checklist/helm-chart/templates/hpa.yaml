{{- if .Values.autoscaling.enabled }}
# Requires the custom-metrics API (Prometheus Adapter, with a rule exposing vLLM's
# vllm:num_requests_waiting gauge as the metric named below) - the default HPA only
# has CPU/memory. See Notes/05-LLM-Serving-on-Kubernetes.mdx.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric:
          name: {{ .Values.autoscaling.queueDepthMetric }}
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.targetWaitingRequestsPerPod | quote }}
{{- end }}

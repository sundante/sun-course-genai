{{- if .Values.autoscaling.enabled }}
# Requires the custom-metrics API (DCGM exporter + Prometheus Adapter) to
# expose a GPU-utilization metric - the default HPA only has CPU/memory.
# See Notes/02-Kubernetes-and-Helm.mdx.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric:
          name: DCGM_FI_DEV_GPU_UTIL
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.targetGPUUtilizationPercentage }}
{{- end }}
